<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZULU TIME // TACTICAL DISPLAY</title>
  <script>
    // Mode: ?mode=green|pink|blue in the address, else the last one picked here, else green.
    (function() {
      let m = new URLSearchParams(location.search).get('mode');
      if (!m) { try { m = localStorage.getItem('zulu-mode'); } catch {} }
      if (m === 'pink' || m === 'blue') document.documentElement.dataset.mode = m;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens — adjusted by media queries below ── */
    :root {
      --green:       #00ff41;
      --green-dim:   #00a828;
      --green-dark:  #003a0e;
      --green-glow:  rgba(var(--fg-rgb),0.25);
      --amber:       #ffb700;
      --cyan:        #00eeff;
      --red:         #ff3c3c;
      --bg:          #000;
      --fg-rgb:      0,255,65;          /* --green as r,g,b, for the faint tints */
      --moon-body:   rgba(0,18,6,1);

      --pad-v:       10px;
      --pad-h:       20px;
      --gap:         8px;
      --zulu-size:   clamp(70px, min(11vw, 13.5vh), 220px);
      --zulu-lsp:    6px;
      --zulu-date-size: clamp(16px, 0.85vw, 20px);
      --zulu-lbl-size:  clamp(13px, 0.7vw, 15px);
      --tz-size:     clamp(32px, 2.8vw, 44px);
      --tz-city-size: clamp(13px, 0.55vw, 15px);
      --tz-meta-size: clamp(12px, 0.5vw, 14px);
      --tz-cols:     5;
      --wx-temp-size: clamp(46px, 4vw, 68px);
      --wx-city-size: clamp(13px, 0.55vw, 15px);
      --wx-sub-size:  clamp(13px, 0.55vw, 14px);
      --wx-cols:     8;
      --topbar-size: clamp(8px, 0.9vw, 11px);   /* topbar unchanged per user request */
      --ticker-size: clamp(13px, 0.6vw, 16px);
      --section-lbl-size: clamp(13px, 0.55vw, 15px);
    }

    /* ── Compact: short screens ─── */
    @media (max-height: 780px) {
      :root {
        --pad-v: 6px;
        --gap:   5px;
        --zulu-size: clamp(52px, min(9.5vw, 10.5vh), 140px);
        --tz-size: clamp(28px, 2.4vw, 36px);
        --wx-temp-size: clamp(36px, 3.4vw, 54px);
      }
    }
    @media (max-height: 620px) {
      :root {
        --pad-v: 4px;
        --gap:   3px;
        --zulu-size: clamp(42px, min(8vw, 9vh), 100px);
        --tz-size: clamp(24px, 2vw, 30px);
        --wx-temp-size: clamp(30px, 2.8vw, 44px);
      }
    }

    /* ── Modes: click the moon or press M. Green is the default above. ─── */
    html[data-mode="pink"] {
      --green:       #ffffff;
      --green-dim:   rgba(255,255,255,0.65);
      --green-dark:  rgba(255,255,255,0.12);
      --green-glow:  rgba(255,255,255,0.3);
      --amber:       #ffffff;
      --cyan:        #ffffff;
      --red:         #ffffff;
      --bg:          #c5006b;
      --fg-rgb:      255,255,255;
      --moon-body:   rgba(140,0,60,1);
    }
    html[data-mode="blue"] {
      --green:       #3ad7ff;
      --green-dim:   #1f8fc4;
      --green-dark:  #06284a;
      --green-glow:  rgba(58,215,255,0.3);
      --cyan:        #c8f2ff;
      --bg:          #010915;
      --fg-rgb:      58,215,255;
      --moon-body:   rgba(3,20,42,1);
    }

    /* ── Narrow screens ─── */
    @media (max-width: 1100px) {
      :root { --tz-size: clamp(28px, 2.6vw, 38px); }
    }
    @media (max-width: 1200px) {
      :root { --wx-cols: 4; }
    }
    @media (max-width: 860px) {
      :root { --tz-cols: 3; --wx-cols: 3; --pad-h: 12px; }
    }
    @media (max-width: 560px) {
      :root { --tz-cols: 2; --wx-cols: 2; --pad-h: 8px; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── CRT scanlines ─── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.11) 3px, rgba(0,0,0,0.11) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
    /* ── Vignette ─── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
      z-index: 998;
    }

    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(var(--fg-rgb),0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--fg-rgb),0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Shell ─── */
    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: var(--pad-v) var(--pad-h) calc(var(--pad-v) - 2px);
      gap: var(--gap);
    }

    /* ── Situational Awareness (left flank) ─── */
    .sa-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      overflow: hidden;
    }
    .sa-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.48s ease;
    }
    .sa-item.fading { opacity: 0; }
    .sa-symbol {
      font-family: 'VT323', monospace;
      font-size: 60px; /* overridden by fitSaPanel() */
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(var(--fg-rgb),0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sa-symbol svg { height: 100%; width: auto; display: block; }
    .sa-cat {
      font-size: var(--tz-city-size);
      letter-spacing: 2.5px;
      color: rgba(var(--fg-rgb),0.42);
      margin-top: 3px;
    }
    .sa-headline {
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 1.25vw, 22px);
      color: rgba(var(--fg-rgb),0.5);
      letter-spacing: 1px;
      line-height: 1.15;
      margin-top: 4px;
    }
    .sa-detail {
      font-size: var(--tz-city-size);
      color: var(--green-dim);
      letter-spacing: 1px;
      line-height: 1.5;
      margin-top: 3px;
    }
    .sa-dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-top: 6px;
      min-height: 14px;
    }
    .sa-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(var(--fg-rgb),0.18);
      transition: background 0.3s;
    }
    .sa-dot.active { background: rgba(var(--fg-rgb),0.7); box-shadow: 0 0 4px rgba(var(--fg-rgb),0.5); }
    @media (max-width: 680px) { .sa-block { display: none; } }

    /* Flicker lives on its own pointer-events:none overlay so .shell stays off
       GPU compositing layers — compositor hit-testing on animated layers breaks
       CSS :hover and pointer events in Chrome on macOS. */
    .flicker-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: black;
      animation: screenflicker 14s infinite;
    }

    @keyframes screenflicker {
      0%,88%,90.5%,93%,100% { opacity: 0; }
      89%  { opacity: .09; }
      91%  { opacity: .03; }
    }

    /* ── Topbar ─── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--green-dark);
      padding-bottom: calc(var(--pad-v) * 0.6);
      font-size: var(--topbar-size);
      letter-spacing: 2.5px;
      color: var(--green-dim);
      flex-shrink: 0;
      min-height: 0;
    }

    .status-left { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
    #sys-status { overflow: hidden; text-overflow: ellipsis; }
    .status-right { display: flex; align-items: center; gap: 14px; white-space: nowrap; flex-shrink: 0; margin-left: 14px; }

    .dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
      animation: heartbeat 3.5s ease-in-out infinite;
    }

    .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

    @keyframes heartbeat {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .25; transform: scale(.65); }
    }

    #feed-status   { color: rgba(var(--fg-rgb),0.65); font-size: var(--topbar-size); }
    #feed-countdown{ color: rgba(var(--fg-rgb),0.65); font-size: var(--topbar-size); margin-left: 4px; }

    /* ── ZULU primary ─── */
    .zulu-block {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2.5vw, 44px);
      flex-shrink: 0;
    }

    .zulu-center {
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .zulu-flank {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    /* Moon panel */
    .moon-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .moon-panel { cursor: pointer; user-select: none; }
    #moon-svg {
      width: var(--zulu-size);
      height: var(--zulu-size);
      display: block;
      filter: drop-shadow(0 0 6px rgba(var(--fg-rgb),0.3));
    }

    .moon-lbl {
      font-size: var(--tz-city-size);
      letter-spacing: 2px;
      color: rgba(var(--fg-rgb),0.42);
      text-align: center;
    }

    @media (max-width: 680px) { .moon-panel { display: none; } }

    .zulu-label {
      font-size: var(--zulu-lbl-size);
      letter-spacing: clamp(4px, 0.8vw, 10px);
      color: var(--green-dim);
      margin-bottom: 1px;
    }

    #local-time {
      font-family: 'VT323', 'Courier New', monospace;
      font-size: var(--zulu-size);
      letter-spacing: var(--zulu-lsp);
      color: var(--green);
      text-shadow:
        0 0 5px  var(--green),
        0 0 12px var(--green),
        0 0 28px var(--green-glow),
        0 0 55px rgba(var(--fg-rgb),0.07);
      display: block;
    }

    #local-date {
      font-size: var(--zulu-date-size);
      letter-spacing: clamp(3px, 0.5vw, 6px);
      color: var(--green-dim);
      margin-top: 1px;
    }

    #zulu-small {
      font-size: var(--zulu-date-size);
      letter-spacing: clamp(3px, 0.5vw, 6px);
      color: var(--green);
      margin-top: 4px;
    }
    #zulu-small .zulu-small-lbl { color: var(--green-dim); }

    /* ── Timezone row ─── */
    .tz-row {
      display: grid;
      grid-template-columns: repeat(var(--tz-cols), 1fr);
      gap: clamp(5px, 0.8vw, 12px);
      flex-shrink: 0;
    }

    .tz-card {
      border: 1px solid rgba(var(--fg-rgb),0.17);
      padding: clamp(5px, 0.6vw, 9px) 6px clamp(4px, 0.5vw, 7px);
      text-align: center;
      background: rgba(var(--fg-rgb),0.018);
      position: relative;
      overflow: hidden;
    }

    .tz-card::after {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green-dim), transparent);
    }

    .tz-city {
      font-size: var(--tz-city-size);
      letter-spacing: clamp(1px, 0.25vw, 3px);
      color: var(--green-dim);
      margin-bottom: 2px;
    }

    .tz-hm {
      font-family: 'VT323', monospace;
      font-size: var(--tz-size);
      color: var(--green);
      text-shadow: 0 0 7px var(--green-glow);
      line-height: 1;
    }

    .tz-meta {
      font-size: var(--tz-meta-size);
      color: rgba(var(--fg-rgb),0.38);
      letter-spacing: 1px;
      margin-top: 1px;
    }

    .tz-sun {
      font-size: var(--tz-meta-size);
      color: rgba(var(--fg-rgb),0.28);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ── Divider ─── */
    .rule {
      border: none;
      border-top: 1px solid rgba(var(--fg-rgb),0.11);
      flex-shrink: 0;
    }

    /* ── Section label ─── */
    .section-head {
      font-size: var(--section-lbl-size);
      letter-spacing: clamp(2px, 0.4vw, 5px);
      color: var(--green-dim);
      margin-bottom: clamp(4px, 0.6vh, 9px);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .section-head::before { content: '◈ '; }
    .section-head::after  { content: ''; flex: 1; height: 1px; background: rgba(var(--fg-rgb),0.11); }

    /* ── Weather ─── */
    .wx-section { flex-shrink: 0; }

    .wx-grid {
      display: grid;
      grid-template-columns: repeat(var(--wx-cols), 1fr);
      gap: clamp(5px, 0.8vw, 12px);
    }

    .wx-card {
      border: 1px solid rgba(var(--fg-rgb),0.17);
      padding: clamp(6px, 0.8vh, 12px) clamp(8px, 1vw, 14px);
      background: rgba(var(--fg-rgb),0.018);
      position: relative;
    }
    .wx-card::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green-dim), transparent);
    }

    .wx-city { font-size: var(--wx-city-size); letter-spacing: 2.5px; color: var(--green-dim); margin-bottom: 3px; }

    .wx-temp {
      font-family: 'VT323', monospace;
      font-size: var(--wx-temp-size);
      color: var(--green);
      text-shadow: 0 0 9px var(--green-glow);
      line-height: 1;
    }
    .wx-unit { font-size: calc(var(--wx-temp-size) * 0.45); color: var(--green-dim); }
    .wx-cond  { font-size: var(--wx-sub-size); color: var(--green-dim); letter-spacing: 1px; margin-top: 1px; }
    .wx-sig   { font-size: var(--wx-sub-size); letter-spacing: 1px; margin-top: 3px; line-height: 1.4; }
    .wx-sig-heat   { color: var(--green); text-shadow: 0 0 8px rgba(var(--fg-rgb),0.5); }
    .wx-sig-warn   { color: var(--amber); text-shadow: 0 0 8px var(--amber-dim); }
    .wx-sig-precip { color: var(--cyan); text-shadow: 0 0 8px rgba(0,200,255,0.5); }
    .wx-sig-sep    { color: rgba(var(--fg-rgb),0.3); }
    .wx-sun   { font-size: var(--wx-sub-size); color: rgba(var(--fg-rgb),0.38); letter-spacing: 1px; margin-top: 2px; }
    .wx-pend  { font-size: calc(var(--wx-sub-size) * 1.1); color: var(--green-dim); animation: blink 1s step-end infinite; }
    .wx-err   { font-size: var(--wx-sub-size); color: var(--red); letter-spacing: 1px; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Press (Presser app) ─── */
    .press-section {
      display: block;
      flex-shrink: 0;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .press-section:hover .section-head { color: var(--green); }
    .press-section:hover .press-card   { border-color: rgba(var(--fg-rgb),0.3); }
    .press-tot { order: 1; letter-spacing: 2px; color: var(--green-dim); }
    .press-grid {
      display: grid;
      grid-template-columns: repeat(var(--wx-cols), minmax(0, 1fr));
      gap: clamp(5px, 0.8vw, 12px);
    }
    .press-card { grid-column: span var(--span, 2); min-width: 0; }
    .press-card.today::after   { background: linear-gradient(90deg, transparent, var(--amber), transparent); }
    .press-card.overdue::after { background: linear-gradient(90deg, transparent, var(--red), transparent); }
    .press-card.overdue { border-color: rgba(255,60,60,0.35); }
    .press-card.today   { border-color: rgba(255,183,0,0.3); }
    .press-card .wx-city { display: flex; justify-content: space-between; gap: 8px; }
    .press-card .wx-city span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .press-card .wx-city span:first-child { color: var(--green); flex-shrink: 0; max-width: 70%; }
    .press-cdrow > span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .press-line { font-size: var(--wx-sub-size); letter-spacing: 1px; color: var(--green-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .press-cdrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: var(--wx-sub-size); letter-spacing: 1px; color: var(--green-dim); white-space: nowrap; }
    .press-cd { font-size: calc(var(--wx-temp-size) * 0.8); }
    .press-cd.today { color: var(--amber); text-shadow: 0 0 9px rgba(255,183,0,0.35); }
    .press-cd .wx-unit { margin: 0 2px; }
    .press-cd .wx-unit:not(:first-child) { margin-right: 0.35em; }   /* the D before the hours */
    .press-cd .wx-unit.ms-days { margin: 0 0 0 0.25em; }   /* a mission's DAYS */
    .press-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; font-size: var(--wx-sub-size); color: var(--green); letter-spacing: 1px; }
    .press-bar > div { flex: 1; height: 8px; border: 1px solid rgba(var(--fg-rgb),0.25); position: relative; }
    .press-bar > div > i { position: absolute; inset: 0 auto 0 0; background: var(--green-dim); box-shadow: 0 0 6px var(--green-glow); }
    /* one segment per check: dark gaps drawn over the fill */
    .press-bar > div::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--seg, 10) - 2px), var(--bg) 0 calc(100% / var(--seg, 10)));
    }
    .press-od { color: var(--red); }
    .press-td { color: var(--amber); }
    .press-late { color: var(--red); }
    .press-off .section-head { margin-bottom: 0; }

    /* ── Missions (cmd fs) — cards reuse the press card styles ─── */
    .missions-section { flex-shrink: 0; }
    .ms-ticks { display: flex; gap: 10px; margin-top: 3px; font-size: var(--wx-sub-size); letter-spacing: 1px; color: rgba(var(--fg-rgb),0.35); white-space: nowrap; overflow: hidden; }
    .ms-ticks .done { color: var(--green); }
    .ms-ticks .need { color: var(--red); }

    /* ── News ticker ─── */
    .ticker {
      border-top: 1px solid rgba(var(--fg-rgb),0.11);
      padding-top: 4px;
      overflow: hidden;
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
      height: clamp(16px, 2.2vh, 22px);
      cursor: default;
      user-select: none;
    }

    #ticker-inner {
      position: absolute;
      top: 4px;
      display: inline-block;
      white-space: nowrap;
      font-size: var(--ticker-size);
      letter-spacing: 1.2px;
      color: rgba(var(--fg-rgb),0.55);
      will-change: transform;
    }

    #ticker-inner .ntag { font-weight: bold; letter-spacing: 2px; }
    #ticker-inner .ntag-world { color: var(--green); }
    #ticker-inner .ntag-us    { color: var(--amber); }
    #ticker-inner .ntag-ca    { color: var(--cyan);  }
    #ticker-inner .ntag-sys   { color: var(--green-dim); }
    #ticker-inner .ntag-wx    { color: var(--amber); }
    #ticker-inner .nsep { color: rgba(var(--fg-rgb),0.22); }

    .news-link { color: inherit; text-decoration: none; }

    /* ── Corner tags ─── */
    .corner {
      position: fixed;
      font-size: clamp(7px, 0.7vw, 9px);
      color: rgba(var(--fg-rgb),0.16);
      letter-spacing: 1.5px;
      z-index: 900;
    }
    .tl { top:3px; left:5px; }
    .bl { bottom:3px; left:5px; }
    .br { bottom:3px; right:5px; }

    /* ── Loading screen ─── */
    #loader {
      position: fixed; inset: 0; z-index: 10000;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    /* Must be pixel-identical to #local-time so the crossfade is seamless */
    #loader-clock {
      font-family: 'VT323', 'Courier New', monospace;
      font-size: var(--zulu-size);
      color: var(--green);
      text-shadow:
        0 0 5px  var(--green),
        0 0 12px var(--green),
        0 0 28px var(--green-glow),
        0 0 55px rgba(var(--fg-rgb),0.07);
      letter-spacing: var(--zulu-lsp);
      line-height: 1;
      display: block;
    }
    #loader-msg {
      font-size: 12px;
      letter-spacing: 5px;
      color: rgba(var(--fg-rgb),0.38);
      margin-top: clamp(18px, 3vh, 36px);
    }
    #loader-msg .ld { opacity: 0; animation: ldot 1.6s infinite; }
    #loader-msg .ld:nth-child(2) { animation-delay: .4s; }
    #loader-msg .ld:nth-child(3) { animation-delay: .8s; }
    @keyframes ldot { 0%,100%{opacity:0} 40%,60%{opacity:1} }
  </style>
</head>
<body>
  <!-- Loading screen — dismissed once wx + news + SA all respond (max 8 s) -->
  <div id="loader">
    <div id="loader-clock">--:--:--</div>
    <div id="loader-msg">LOADING<span class="ld">.</span><span class="ld">.</span><span class="ld">.</span></div>
  </div>

  <div class="grid-bg"></div>
  <div class="flicker-overlay"></div>
  <div class="corner tl">CCLOCK v3.0 // ARX</div>
  <div class="corner bl">LAT:37.87N LON:122.27W</div>

  <div class="shell">

    <!-- Topbar -->
    <div class="topbar">
      <div class="status-left">
        <span class="dot" id="sys-dot"></span>
        <span id="sys-status">SOURCES: CHECKING&hellip;</span>
      </div>
      <div class="status-right">
        <span><span id="feed-status">HEADLINES: LOADING&hellip;</span><span id="feed-countdown"></span></span>
      </div>
    </div>

    <!-- ZULU -->
    <div class="zulu-block">
      <div class="zulu-flank">
        <div class="sa-block">
          <div class="sa-item" id="sa-item"></div>
          <div class="sa-dots" id="sa-dots"></div>
        </div>
      </div>
      <div class="zulu-center">
        <div class="zulu-label" id="clock-label">&#9668; &nbsp; &#9658;</div>
        <span id="local-time">--:--:--</span>
        <div id="local-date">SYNCHRONIZING&hellip;</div>
        <div id="zulu-small"><span class="zulu-small-lbl" id="small-lbl">&nbsp;</span> <span id="small-time">--:--:--</span></div>
      </div>
      <div class="zulu-flank">
        <div class="moon-panel" id="moon-panel" title="Change mode (M)">
          <svg id="moon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="mglow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <clipPath id="moon-clip"><circle cx="50" cy="50" r="45"/></clipPath>
              <pattern id="moon-grid" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
                <rect width="6" height="6" fill="none"/>
                <rect width="5" height="5" fill="rgba(0,0,0,0.18)"/>
              </pattern>
            </defs>
            <!-- Dark body -->
            <circle cx="50" cy="50" r="45" style="fill:var(--moon-body);stroke:rgba(var(--fg-rgb),0.18)" stroke-width="1.5"/>
            <!-- Lit portion -->
            <path id="moon-lit" clip-path="url(#moon-clip)" style="fill:rgba(var(--fg-rgb),0.22)" filter="url(#mglow)"/>
            <!-- Pixel grid overlay for block aesthetic -->
            <circle cx="50" cy="50" r="45" fill="url(#moon-grid)" clip-path="url(#moon-clip)"/>
            <!-- Outer ring glow -->
            <circle cx="50" cy="50" r="45" style="fill:none;stroke:rgba(var(--fg-rgb),0.12)" stroke-width="3"/>
          </svg>
          <div id="moon-lbl" class="moon-lbl"></div>
        </div>
      </div>
    </div>

    <!-- Timezones (5 cities, Portland removed) -->
    <div class="tz-row" id="tz-row"></div>

    <hr class="rule">

    <!-- Weather -->
    <div class="wx-section">
      <div class="section-head">CALIFORNIA WEATHER INTEL &mdash; <span id="wx-status">OPEN-METEO</span></div>
      <div class="wx-grid" id="wx-grid"></div>
    </div>

    <!-- Press: overdue, today and the next countdown from the Presser app (click opens it) -->
    <a class="press-section" id="press" target="_blank" rel="noopener">
      <div class="section-head" id="press-head">PRESS</div>
      <div id="press-body"></div>
    </a>

    <!-- Missions: upcoming FS missions from cmd fs's mmGetMissions, through server.py -->
    <div class="missions-section" id="missions">
      <div class="section-head" id="missions-head">MISSIONS</div>
      <div id="missions-body"></div>
    </div>

    <!-- Live news ticker -->
    <div class="ticker">
      <span id="ticker-inner"></span>
    </div>

  </div>

  <script src="zulu-clock.js"></script>
</body>
</html>
